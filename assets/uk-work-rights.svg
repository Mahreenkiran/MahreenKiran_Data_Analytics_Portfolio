    </filter>
  </defs>

  <rect x="10" y="10" width="500" height="40" rx="10" fill="#16343B" stroke="#F0B64D" stroke-width="2" filter="url(#glow)"></rect>

  <text x="260" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#F0B64D">
    🇬🇧 Full UK Work Rights • No Sponsorship Required
  </text>
</svg>